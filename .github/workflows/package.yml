name: package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - name: Package tests
        run: ./test/package-test.sh
      - name: Docker build
        run: docker build --pull --no-cache --platform linux/amd64 -t instatic-cloudron:test .
