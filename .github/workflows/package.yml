name: package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - name: Download pinned upstream source
        run: |
          curl -fsSL --retry 5 https://github.com/CoreBunch/Instatic/archive/refs/tags/v0.0.17.tar.gz -o /tmp/instatic.tar.gz
          echo '53a9ca19f798db7459d81ca96c15d1fe9000a970bde6f544adf660b292ee5bae  /tmp/instatic.tar.gz' | sha256sum -c -
          mkdir /tmp/instatic
          tar -xzf /tmp/instatic.tar.gz --strip-components=1 -C /tmp/instatic
      - name: Package tests
        run: ./test/package-test.sh /tmp/instatic
      - name: Docker build
        run: docker build --pull --no-cache --platform linux/amd64 -t instatic-cloudron:test .
