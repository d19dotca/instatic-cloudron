name: release

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/d19dotca/instatic-cloudron
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Install test dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Verify release reference and package
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version CloudronManifest.json)"
          case "${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" in
            "branch:release/v${version}") ;;
            *) echo "Release ref does not match manifest version ${version}" >&2; exit 1 ;;
          esac
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} already exists; refusing to overwrite its image tag." >&2
            exit 1
          fi
          ./test/package-test.sh
          git diff --check

      - name: Build linux/amd64 image
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version CloudronManifest.json)"
          docker build --pull --platform linux/amd64 --tag "${IMAGE}:${version}" .

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish image
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version CloudronManifest.json)"
          docker push "${IMAGE}:${version}"

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version CloudronManifest.json)"
          escaped_version="${version//./\\.}"
          gh release create "v${version}" \
            --target "${GITHUB_SHA}" \
            --title "Instatic for Cloudron ${version}" \
            --notes "$(sed -n "/^\\[${escaped_version}\\]$/,/^$/p" CHANGELOG | tail -n +2)"
