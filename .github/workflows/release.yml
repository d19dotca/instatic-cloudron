name: release

on:
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/d19dotca/instatic-cloudron
    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Verify release reference and package
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version CloudronManifest.json)"
          case "${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" in
            "tag:v${version}"|"branch:release/v${version}") ;;
            *) echo "Release ref does not match manifest version ${version}" >&2; exit 1 ;;
          esac
          ./test/package-test.sh
          git diff --check

      - name: Build linux/amd64 image
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version CloudronManifest.json)"
          docker build --pull --platform linux/amd64 --tag "${IMAGE}:${version}" .

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish image
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version CloudronManifest.json)"
          docker push "${IMAGE}:${version}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version CloudronManifest.json)"
          gh release create "v${version}" \
            --target "${GITHUB_SHA}" \
            --title "Instatic for Cloudron ${version}" \
            --notes "$(sed -n '/^\[0.1.4\]/,/^$/p' CHANGELOG | tail -n +2)"
